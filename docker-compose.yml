services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: enterprise_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC port for high-speed production queries
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  qdrant_data:
    driver: local
