services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: enterprise_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web Dashboard
      - "6334:6334" # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  rag_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000" # FastAPI & Swagger UI (http://localhost:8000/docs)
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - fastembed_cache:/app/.fastembed_cache
    depends_on:
      - qdrant
    profiles:
      - fullstack # Starts when running 'docker compose --profile fullstack up'

volumes:
  qdrant_data:
    driver: local
  fastembed_cache:
    driver: local
